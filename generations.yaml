generations:
  - name: "First Generation (Pre-Facelift)"
    start_year: 2019
    end_year: 2023
    description: "The Škoda Scala represents a new direction for the Czech brand in the compact hatchback segment, effectively replacing both the Rapid Spaceback and serving as a more direct competitor to established models like the Volkswagen Golf and Ford Focus. The name 'Scala,' derived from the Latin word for 'ladder' or 'stairs,' signals Škoda's ambition to move upmarket with this model. Built on the Volkswagen Group's MQB A0 platform shared with models like the Volkswagen Polo and SEAT Ibiza, the Scala maximizes the platform's potential by stretching it to its limits, resulting in a vehicle measuring approximately 4.36 meters in length—significantly larger than most MQB A0-based vehicles. The exterior design, led by Oliver Stefani, features more emotional styling than previous Škoda models, with a distinctive front end, sharp character lines, and extended glass area on the tailgate where the Škoda name is spelled out in individual letters rather than using the logo—a first for the brand in Europe. Engine options include 1.0 TSI three-cylinder and 1.5 TSI four-cylinder gasoline engines, plus a 1.6 TDI diesel in some markets, with power outputs ranging from 95 to 150 horsepower. Transmission options include five and six-speed manuals and a seven-speed DSG dual-clutch automatic depending on engine selection. The interior represents a significant step forward for Škoda, featuring a free-standing infotainment screen up to 9.2 inches, an optional 10.25-inch Virtual Cockpit digital instrument display, and higher quality materials than the Rapid it replaces. Consistent with Škoda's 'Simply Clever' philosophy, the Scala incorporates numerous practical features including an ice scraper in the fuel filler cap, an umbrella in the driver's door, and a ticket holder on the windshield."

  - name: "First Generation (Facelift)"
    start_year: 2023
    end_year: null
    description: "A facelift was unveiled in August 2023 alongside the Kamiq. The changes include redesigned front and rear fascias with the availability of matrix LED headlights, a sportier bodykit inspired from the Vision RS concept, new exterior colours and new alloy wheel designs. Inside, there is a redesigned control panel used to operate the HVAC system, more recycled materials used for the interior improvised standard interior equipment across the line-up, and extra Simply Clever features borrowed from other Škoda models. Škoda has also updated the trim structure and diesel engines are no longer available for the facelift model. The Scala continues to be built on the MQB A0 platform and offers the same practical interior space with class-leading rear legroom and a 467-liter cargo capacity."